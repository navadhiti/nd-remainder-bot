reminders:
  - id: invoice_reminder
    message: |
      Send invoice for {{month}} {{year}}
    schedule: "0 9 2 * *"
    timezone: "Asia/Kolkata"
    enabled: true
    channels:
      - google_chat
      - email
    email_recipients:
      - devops@navadhiti.com

  - id: invoice_followup
    message: |
      Follow up on invoice for {{month}} {{year}}
    schedule_type: interval_days
    interval_days: 45
    start_date: "2026-04-01"
    timezone: "Asia/Kolkata"
    enabled: true
    channels:
      - google_chat

  - id: ichb_monthly_data
    message: |
      run the query in HFAC prod env [mongo DB] and send the data to HFAC client :
      
      Luiz Mazzon <luiz@certifiedhumaneinternational.org>
      
      Subject: Region wise user in the label application - <<month>>
      
      db.guidelines.aggregate([
        {
          $match: { isActive: true }
        },
        {
          $lookup: {
            from: "customers",
            localField: "identifier",
            foreignField: "country",
            as: "customers"
          }
        },
        {
          $unwind: "$customers"
        },
        {
          $lookup: {
            from: "users",
            let: { customerId: "$customers._id" },
            pipeline: [
              {
                $match: {
                  $expr: {
                    $and: [
                      { $isArray: "$CustomerId" } // ensure it's an array
                      { $in: ["$$customerId", "$CustomerId"] }
                    ]
                  }
                }
              }
            ],
            as: "users"
          }
        },
        {
          $unwind: {
            path: "$users",
            preserveNullAndEmptyArrays: true
          }
        },
        {
          $group: {
            _id: "$name.en",
            customersSet: { $addToSet: "$customers._id" },
            usersSet: { $addToSet: "$users._id" }
          }
        },
        {
          $project: {
            _id: 0,
            country: "$_id",
            no_of_customers: { $size: "$customersSet" },
            no_of_users: {
              $size: {
                $filter: {
                  input: "$usersSet",
                  as: "u",
                  cond: { $ne: ["$$u", null] }
                }
              }
            }
          }
        }
      ])
    schedule: "0 9 28-31 * *"
    timezone: "Asia/Kolkata"
    enabled: true
    channels:
      - webhook
    email_recipients:
      - devops@navadhiti.com

  - id: gcs_gsutill_package_update
    message: |
      The only scenario where action will be required is when provisioning new VMs or creating new environments with the Google Cloud CLI version released after March 2027. In those cases, gsutil will no longer be included by default, and we will either:
      
      Update our scripts to use the recommended gcloud storage commands, or
      Install gsutil separately if it is still required.
      
      We have to check this once we completed the quee in seva portal
      
      Make it as least priority
    schedule_type: interval_days
    interval_days: 45
    start_date: "2026-07-23"
    timezone: "Asia/Kolkata"
    enabled: true
    channels:
      - email
    email_recipients:
      - devops@navadhiti.com

